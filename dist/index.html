async function saveToCloud() {
  try {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) return;

    const { data: existing } = await supabaseClient
      .from('app_data')
      .select('id')
      .eq('user_id', user.id)
      .maybeSingle();

    if (existing) {
      await supabaseClient
        .from('app_data')
        .update({
          data: data,
          updated_at: new Date().toISOString()
        })
        .eq('id', existing.id);
    } else {
      await supabaseClient
        .from('app_data')
        .insert({
          user_id: user.id,
          data: data,
          updated_at: new Date().toISOString()
        });
    }
  } catch (error) {
    console.error('Error guardando en la nube:', error);
  }
}

 else if(el.id==='backup-input')readBackup(el.files[0]);

document.addEventListener('keydown',e=>{
 const target=e.target,editable=target.matches('input,textarea,select,[contenteditable="true"]');
 if((target.id==='person-input'&&(e.key==='Enter'||e.key===','))||(target.id==='equipment-input'&&e.key==='Enter')){e.preventDefault();target.id==='person-input'?addPeople():addEquipment();return}
 if(e.key==='Escape'){if($('.popover'))closePopover(true);else if(overlayType)closeOverlay();else if(query){query='';$('#global-search').value='';render()}return}
 if($('.popover')&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const buttons=[...$('.popover').querySelectorAll('button')],i=buttons.indexOf(document.activeElement),n=e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;buttons[n]?.focus();return}
 if(e.key==='Tab'&&$('.popover')){const buttons=[...$('.popover').querySelectorAll('button')];const first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}return}
 if(e.key==='Tab'&&overlayType){const els=[...$('.modal').querySelectorAll('button:not([disabled]),a[href],input:not([disabled]):not([type=hidden]),select,textarea,[tabindex="0"]')].filter(x=>x.getClientRects().length),first=els[0],last=els[els.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('.modal'))){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}return}
 if(editable||overlayType||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key.toLowerCase()==='n'){e.preventDefault();openForm()}else if(e.key==='/'){e.preventDefault();$('#global-search').focus()}else if(e.key.toLowerCase()==='t'&&page==='calendar'){e.preventDefault();calDate=today();render()}

function switchWorkspace(){
  save();

 document.body.classList.add('selecting-space');
 document.body.removeAttribute('data-space');

  const selector=document.getElementById('workspace-selector');
  selector.hidden=false;

function enterWorkspace(id){
 
  if(!profiles[id])return;

  activeUserId=id;

  if(id==='enzo'){
    data=spaces.enzo||data;
  }else{
    data=spaces.santiago||blankWorkspace();
  }

  spaces[id]=data;

  document.body.dataset.space=id;
  document.body.classList.remove('selecting-space');

  const selector=document.getElementById('workspace-selector');
  selector.hidden=true;

  render();
  checkReminders();
}

document.addEventListener('click',function(e){
  const workspace=e.target.closest('[data-workspace]');
  if(!workspace)return;

  enterWorkspace(workspace.dataset.workspace);
});

      render();
      checkReminders();
      return;
    }

    const result = await supabaseClient.auth.getSession();
    session = result.data.session;
  }

  const { data: cloudData, error } = await supabaseClient
    .from('app_data')
    .select('data')
    .eq('user_id', user.id)

  spaces.enzo=data;
